<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Configuración - Presupuestos</title>

  <!-- ========================================== -->
  <!-- 1. ESTILOS Y APARIENCIA (CSS)              -->
  <!-- ========================================== -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #1a2530;
      padding: 15px;
    }

    .panel-container {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1.panel-title {
      font-size: 1.6rem;
      color: #0f2a4a;
      margin-bottom: 15px;
      border-bottom: 2px solid #0f2a4a;
      padding-bottom: 8px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #0f2a4a;
      margin-top: 15px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: #f8fafc;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row-btn {
      display: flex;
      gap: 8px;
      margin-bottom: 5px;
    }

    /* Botones */
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-dark { background-color: #334155; color: #fff; }
    .btn-navy { background-color: #1e3a8a; color: #fff; }
    .btn-purple { background-color: #7c3aed; color: #fff; }
    .btn-danger { background-color: #dc2626; color: #fff; }

    /* Desplegables (Accordion) */
    details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    summary {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      color: #0f2a4a;
      user-select: none;
    }

    .details-content {
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sub-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>
</head>
<body>

  <div class="panel-container">
    
    <h1 class="panel-title">Panel de Configuración</h1>

    <!-- ========================================================= -->
    <!-- 2. COPIA DE SEGURIDAD (MEMORIA, HISTORIAL Y RESET DENTRO) -->
    <!-- ========================================================= -->
    <details open>
      <summary>▶ 💾 Copia de Seguridad (Backup)</summary>
      <div class="details-content">
        
        <!-- SUB-BLOQUE: MEMORIA E HISTORIAL -->
        <div class="sub-section-title">📚 Memoria e Historial</div>
        
        <div class="form-group" style="margin-bottom: 6px;">
          <label>Cargar Documento Emitido Anteriormente</label>
          <select id="select-memoria">
            <option>-- Seleccionar de la Memoria --</option>
          </select>
        </div>

        <div class="row-btn">
          <button type="button" class="btn btn-dark" onclick="guardarEnMemoria()">💾 Guardar en Memoria</button>
          <button type="button" class="btn btn-danger" onclick="borrarDeMemoria()">🗑️ Borrar de Memoria</button>
        </div>

        <!-- SUB-BLOQUE: ARCHIVOS JSON -->
        <div class="sub-section-title" style="margin-top: 6px;">📂 Archivos de Respaldo</div>

        <div class="row-btn">
          <button type="button" class="btn btn-dark" onclick="descargarBackupJSON()">⬇️ Descargar Copia (JSON)</button>
          <button type="button" class="btn btn-dark" onclick="document.getElementById('input-cargar-backup').click()">⬆️ Cargar Copia (JSON)</button>
        </div>
        <input type="file" id="input-cargar-backup" accept=".json" style="display:none;" onchange="cargarBackupJSON(event)">
        
        <!-- BOTÓN ROJO DE RESET -->
        <div class="sub-section-title" style="margin-top: 6px;">🚨 Zona de Peligro</div>
        <button type="button" class="btn btn-danger" onclick="ejecutarResetTotal()">
          ⚠️ Resetear Completo (Descarga Backup Automático)
        </button>

      </div>
    </details>


    <!-- ========================================== -->
    <!-- 3. NUMERACIÓN DEL DOCUMENTO                -->
    <!-- ========================================== -->
    <div class="section-title">Numeración del Documento</div>

    <div class="grid-2">
      <div class="form-group">
        <label>Tipo Documento</label>
        <select id="tipo-documento">
          <option>Presupuesto</option>
          <option>Factura</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nº Documento (Escribe ej: 2 o 500)</label>
        <input type="text" id="num-documento" value="PRES-2026-001">
      </div>
    </div>

    <button type="button" class="btn btn-navy" style="margin-bottom: 8px;" onclick="nuevoDocumentoSiguiente()">
      ➕ Nuevo Documento Siguiente
    </button>

    <button type="button" class="btn btn-purple" style="margin-bottom: 12px;" onclick="cambiarAFactura()">
      🔄 Cambiar a FACTURA
    </button>


    <!-- ========================================== -->
    <!-- 4. LOGO Y DATOS DE EMPRESA                 -->
    <!-- ========================================== -->
    <div class="form-group">
      <label>Subir Nuevo Logo al Banco de Logos</label>
      <input type="file" id="upload-logo">
    </div>

    <div class="form-group">
      <label>Seleccionar Logo de la Galería</label>
      <select id="select-logo">
        <option>- Sin Logo / Texto -</option>
      </select>
    </div>

    <details>
      <summary>▶ ✏️ Editar Datos de la Empresa</summary>
      <div class="details-content">
        <!-- Campos de empresa aquí -->
      </div>
    </details>

    <div class="grid-2">
      <div class="form-group">
        <label>Fecha</label>
        <input type="text" value="19/09/2026">
      </div>
      <div class="form-group">
        <label>Validez del documento</label>
        <input type="text" value="30 Días">
      </div>
    </div>


    <!-- ========================================== -->
    <!-- 5. DATOS DEL CLIENTE                       -->
    <!-- ========================================== -->
    <div class="section-title">Datos del Cliente</div>

    <div class="form-group">
      <label>Cargar Cliente Guardado</label>
      <select id="select-cliente">
        <option>-- Nuevo / Limpiar Cliente --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nombre / Empresa</label>
      <input type="text" placeholder="Nombre del cliente">
    </div>

  </div>


  <!-- ========================================== -->
  <!-- 6. LÓGICA Y FUNCIONALIDAD JS               -->
  <!-- ========================================== -->
  <script>
    // Función de Reset Total
    function ejecutarResetTotal() {
      const confirmar = confirm("⚠️ ¿ESTÁS SEGURO?\n\nSe descargará una copia de seguridad automática y se reiniciará todo el sistema por completo.");
      
      if (confirmar) {
        // 1. Descarga automática antes de borrar
        descargarBackupJSON();

        // 2. Borrado de memoria local
        localStorage.clear();

        // 3. Alerta y recarga
        alert("Sistema reiniciado correctamente.");
        window.location.reload();
      }
    }

    function descargarBackupJSON() {
      const backupData = JSON.stringify(localStorage);
      const blob = new Blob([backupData], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_auto_${Date.now()}.json`;
      a.click();
    }

    function cargarBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          Object.keys(data).forEach(key => {
            localStorage.setItem(key, data[key]);
          });
          alert("Copia de seguridad restaurada con éxito.");
          window.location.reload();
        } catch (err) {
          alert("Error al procesar el archivo JSON.");
        }
      };
      reader.readAsText(file);
    }

    function guardarEnMemoria() { alert("Guardado en memoria."); }
    function borrarDeMemoria() { alert("Borrado de memoria."); }
    function nuevoDocumentoSiguiente() { alert("Nuevo documento listo."); }
    function cambiarAFactura() { alert("Cambiado a Factura."); }
  </script>

</body>
</html>
