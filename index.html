<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Presupuestos - Carrascosa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        .presupuesto-hoja {
            width: 800px;
            height: 1131px;
            background-image: url('plantilla más limpia.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .input-limpio {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #1f2937;
        }

        @media print {
            body * { visibility: hidden; }
            #captura-area, #captura-area * { visibility: visible; }
            #captura-area { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
            .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-5xl mx-auto flex flex-col items-center">
        
        <!-- PANEL DE CONTROL -->
        <div class="no-print w-full bg-white p-6 rounded-xl shadow-md mb-8">
            <h1 class="text-xl font-bold text-slate-800 mb-4">🛠️ Rellenar Presupuesto - Carrascosa</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Nombre del Cliente</label>
                    <input type="text" id="val-nombre" placeholder="Ej: EVA" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Teléfono</label>
                    <input type="text" id="val-telefono" placeholder="Ej: 635 42 99 38" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Dirección</label>
                    <input type="text" id="val-direccion" placeholder="Ej: C/ República Argentina 70, 4º D" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Fecha</label>
                    <input type="text" id="val-fecha" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 border-t pt-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Entrega a cuenta (Anticipo 50%)</label>
                    <input type="text" id="val-anticipo" placeholder="Ej: 5.420 €" class="w-full border rounded-lg px-3 py-2 text-sm font-bold text-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">TOTAL (SIN IVA)</label>
                    <input type="text" id="val-total" placeholder="Ej: 10.840 €" class="w-full border rounded-lg px-3 py-2 text-sm font-bold text-emerald-600">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Trabajos a realizar (Usa viñetas •)</label>
                    <textarea id="val-trabajos" rows="6" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="• Suministro y colocación...&#10;• Retirada de tabiques..."></textarea>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 justify-end">
                <button onclick="descargarJPG()" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-700 transition">📸 Descargar JPG</button>
                <button onclick="descargarPDF()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-500 transition">📄 Descargar PDF</button>
            </div>
        </div>

        <!-- HOJA DE PRESUPUESTO -->
        <div id="captura-area" class="presupuesto-hoja text-slate-800">
            
            <!-- DATOS CLIENTE -->
            <div class="absolute" style="top: 60px; left: 520px; width: 250px;">
                <div class="mb-1"><input type="text" id="out-nombre" class="input-limpio font-medium" readonly></div>
                <div class="mb-1"><input type="text" id="out-direccion" class="input-limpio font-medium" readonly></div>
                <div class="mb-1"><input type="text" id="out-telefono" class="input-limpio font-medium" readonly></div>
                <div><input type="text" id="out-fecha" class="input-limpio font-medium" readonly></div>
            </div>

            <!-- TRABAJOS -->
            <div class="absolute" style="top: 275px; left: 65px; width: 670px; height: 380px;">
                <pre id="out-trabajos" class="w-full h-full bg-transparent border-none text-slate-800 text-[13px] leading-relaxed whitespace-pre-wrap font-sans"></pre>
            </div>

            <!-- BLOQUES DINÁMICOS -->
            <div class="absolute" style="top: 680px; left: 70px; width: 670px;">
                <p id="out-manoobra" class="text-red-600 font-semibold text-[14px]"></p>
            </div>

            <div class="absolute" style="top: 705px; left: 70px; width: 670px;">
                <p id="out-entrega" class="text-slate-800 font-medium text-[14px]"></p>
            </div>

            <div class="absolute" style="top: 730px; left: 70px; width: 670px;">
                <p id="out-total" class="text-slate-900 font-bold text-[16px]"></p>
            </div>

        </div>

    </div>

    <script>
        const hoy = new Date();
        const fechaFormateada = String(hoy.getDate()).padStart(2, '0') + ' / ' + String(hoy.getMonth() + 1).padStart(2, '0') + ' / ' + hoy.getFullYear();
        document.getElementById('val-fecha').value = fechaFormateada;

        const vNombre = document.getElementById('val-nombre');
        const vDireccion = document.getElementById('val-direccion');
        const vTelefono = document.getElementById('val-telefono');
        const vFecha = document.getElementById('val-fecha');
        const vAnticipo = document.getElementById('val-anticipo');
        const vTotal = document.getElementById('val-total');
        const vTrabajos = document.getElementById('val-trabajos');

        const oNombre = document.getElementById('out-nombre');
        const oDireccion = document.getElementById('out-direccion');
        const oTelefono = document.getElementById('out-telefono');
        const oFecha = document.getElementById('out-fecha');
        const oTrabajos = document.getElementById('out-trabajos');
        const oManoObra = document.getElementById('out-manoobra');
